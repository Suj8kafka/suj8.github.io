<svg class="ld-handwriting" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 148" width="304" height="148" aria-hidden="true" focusable="false">
  <title>नमस्ते</title>
  <metadata>Hand-drawn Namaste. Ten continuous pen strokes with short lifts, finishing with the Devanagari headline at 860 ms. The visible ink follows each path directly.</metadata>
  <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <!-- न: the small loop and connecting arm, then the downstroke. -->
    <path class="ld-write-stroke" pathLength="1" stroke-width="7.5" style="--pen-delay:0ms;--pen-duration:75ms" d="M27 87 C21 88 25 101 33 102 C42 103 40 88 33 87 C45 89 58 88 71 86"/>
    <path class="ld-write-stroke" pathLength="1" stroke-width="7.2" style="--pen-delay:87ms;--pen-duration:60ms" d="M72 55 C71 77 70 105 72 128"/>
    <!-- म: one flowing downstroke, loop and arm, followed by its stem. -->
    <path class="ld-write-stroke" pathLength="1" stroke-width="7.5" style="--pen-delay:161ms;--pen-duration:96ms" d="M108 55 C106 72 107 91 107 104 C107 114 93 102 97 96 C100 90 116 96 128 95 L146 94"/>
    <path class="ld-write-stroke" pathLength="1" stroke-width="7.2" style="--pen-delay:269ms;--pen-duration:60ms" d="M147 56 C145 79 145 105 147 128"/>
    <!-- स्त: the curved half-स, its join, then त and its downstroke. -->
    <path class="ld-write-stroke" pathLength="1" stroke-width="7.5" style="--pen-delay:343ms;--pen-duration:92ms" d="M193 56 C203 72 200 88 181 95 C171 100 169 78 177 88 C184 102 193 116 203 128"/>
    <path class="ld-write-stroke" pathLength="1" stroke-width="7" style="--pen-delay:445ms;--pen-duration:32ms" d="M192 91 Q206 98 225 94"/>
    <path class="ld-write-stroke" pathLength="1" stroke-width="7.5" style="--pen-delay:487ms;--pen-duration:75ms" d="M269 83 C253 82 236 80 227 91 C218 103 228 118 240 128"/>
    <path class="ld-write-stroke" pathLength="1" stroke-width="7.2" style="--pen-delay:574ms;--pen-duration:60ms" d="M270 54 C269 77 269 104 271 128"/>
    <!-- े is added above the last letter before the final headline. -->
    <path class="ld-write-stroke" pathLength="1" stroke-width="7" style="--pen-delay:648ms;--pen-duration:60ms" d="M270 53 C263 31 262 15 237 22"/>
    <path class="ld-write-stroke" pathLength="1" stroke-width="6.8" style="--pen-delay:724ms;--pen-duration:136ms;--pen-easing:cubic-bezier(.2,.05,.65,1)" d="M17 55 C88 53 192 58 287 54"/>
  </g>
</svg>
