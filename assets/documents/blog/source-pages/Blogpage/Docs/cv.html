<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Documents</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #f9f9f9;
    }

    h1 {
      text-align: center;
      margin-bottom: 40px;
    }

    .pdf-container {
      width: 100%;
      max-width: 900px; /* large screen width */
      margin: 20px auto;
      border: 1px solid #ccc;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    iframe {
      width: 100%;
      height: 600px; /* desktop default */
      border: none;
    }

    @media (max-width: 768px) {
      iframe {
        height: 400px; /* smaller height for phones/tablets */
      }
    }

    .label {
      text-align: center;
      margin: 10px 0;
      font-weight: bold;
    }
  </style>
</head>
<body>

<h1>📄 My Documents</h1>

<div class="pdf-container">
  <div class="label">Sujeet Khadka Resume (PDF)</div>
  <iframe src="sujeet-khadka-resume.pdf"></iframe>
</div>

</html>
